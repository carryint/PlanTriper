<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PlanTriper - Trip Route & Travel Planner</title>
    <script>
      (function() {
        var path = window.location.pathname;
        if (!window.location.hash && path.includes('/plan/')) {
          var planIndex = path.indexOf('/plan/');
          var base = path.substring(0, planIndex);
          var subPath = path.substring(planIndex);
          window.location.replace(base + '/#' + subPath + window.location.search);
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
